<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>HireSmart — Test UI</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: sans-serif; background: #0f0f0f; color: #e0e0e0; padding: 40px; max-width: 860px; margin: auto; }
    h1 { color: #facc15; margin-bottom: 8px; }
    p.sub { color: #888; margin-bottom: 32px; }
    .card { background: #1a1a1a; border: 1px solid #2a2a2a; border-radius: 12px; padding: 24px; margin-bottom: 24px; }
    label { display: block; margin-bottom: 8px; color: #facc15; font-weight: bold; }
    input, textarea { width: 100%; padding: 12px; background: #111; border: 1px solid #333; border-radius: 8px; color: #e0e0e0; font-size: 14px; margin-bottom: 12px; }
    textarea { resize: vertical; }
    button { padding: 12px 28px; background: #facc15; color: #000; font-weight: bold; border: none; border-radius: 8px; cursor: pointer; font-size: 15px; }
    button:hover { background: #eab308; }
    pre { background: #111; border: 1px solid #2a2a2a; border-radius: 8px; padding: 16px; white-space: pre-wrap; margin-top: 16px; font-size: 13px; color: #4ade80; min-height: 50px; }
    .file-row { display: flex; align-items: center; gap: 12px; }
    .file-row input[type=file] { flex: 1; }
    .step-num { display: inline-block; background: #facc15; color: #000; font-weight: bold; border-radius: 50%; width: 28px; height: 28px; text-align: center; line-height: 28px; margin-right: 8px; }
    .question-list { margin-top: 16px; display: flex; flex-direction: column; gap: 12px; }
    .question-item { background: #111; border: 1px solid #2a2a2a; border-radius: 8px; padding: 16px; color: #e0e0e0; font-size: 14px; display: flex; gap: 12px; align-items: flex-start; }
    .q-num { background: #facc15; color: #000; font-weight: bold; border-radius: 50%; width: 28px; height: 28px; min-width: 28px; text-align: center; line-height: 28px; font-size: 13px; }
    .q-text { line-height: 1.6; }
    .badge { display: inline-block; padding: 4px 10px; border-radius: 20px; font-size: 12px; font-weight: bold; margin-top: 4px; }
    .badge-success { background: #14532d; color: #4ade80; }

    /* Evaluation result styles */
    .eval-result { margin-top: 16px; display: flex; flex-direction: column; gap: 16px; }
    .score-box { background: #111; border: 2px solid #facc15; border-radius: 12px; padding: 20px; text-align: center; }
    .score-number { font-size: 56px; font-weight: bold; color: #facc15; line-height: 1; }
    .score-label { font-size: 14px; color: #888; margin-top: 4px; }
    .eval-section { background: #111; border: 1px solid #2a2a2a; border-radius: 8px; padding: 16px; }
    .eval-section h3 { font-size: 13px; font-weight: bold; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 1px; }
    .eval-section p { font-size: 14px; line-height: 1.7; color: #d0d0d0; }
    .strengths h3 { color: #4ade80; }
    .improvements h3 { color: #f87171; }
    .ideal h3 { color: #60a5fa; }
  </style>
</head>
<body>

<h1>⚡ HireSmart Test UI</h1>
<p class="sub">Test your full API like a real user — no Swagger needed.</p>

<!-- STEP 1: LOGIN -->
<div class="card">
  <label><span class="step-num">1</span>Login</label>
  <input id="email" placeholder="Email" value="alice@example.com" />
  <input id="password" type="password" placeholder="Password" value="password123" />
  <button onclick="login()">Login →</button>
  <pre id="login-result">Status will appear here...</pre>
</div>

<!-- STEP 2: UPLOAD RESUME -->
<div class="card">
  <label><span class="step-num">2</span>Upload Resume (PDF or DOCX)</label>
  <div class="file-row">
    <input type="file" id="resume-file" accept=".pdf,.docx" />
    <button onclick="uploadResume()">Upload Resume →</button>
  </div>
  <pre id="resume-result">Upload result will appear here...</pre>
</div>

<!-- STEP 3: SKILL GAP -->
<div class="card">
  <label><span class="step-num">3</span>Paste Job Description & Analyze Skill Gap</label>
  <input id="job-title" placeholder="Job Title  e.g. Data Scientist" />
  <textarea id="job-desc" rows="10" placeholder="Paste the full job description here..."></textarea>
  <button onclick="analyzeSkillGap()">Analyze Skill Gap →</button>
  <pre id="gap-result">Results will appear here...</pre>
</div>

<!-- STEP 4: GENERATE INTERVIEW QUESTIONS -->
<div class="card">
  <label><span class="step-num">4</span>Generate Interview Questions (RAG + Claude AI)</label>
  <textarea id="interview-jd" rows="8" placeholder="Paste job description here to generate personalized questions from your resume..."></textarea>
  <button onclick="generateQuestions()">Generate Questions →</button>
  <div id="questions-output"></div>
</div>

<!-- STEP 5: EVALUATE ANSWER -->
<div class="card">
  <label><span class="step-num">5</span>Evaluate Your Answer (Claude AI Coach)</label>
  <label style="color:#aaa; font-weight:normal; margin-bottom:4px;">Question Asked</label>
  <textarea id="eval-question" rows="3" placeholder="Paste or type the interview question here..."></textarea>

  <label style="color:#aaa; font-weight:normal; margin-bottom:4px;">Your Answer</label>
  <textarea id="eval-answer" rows="6" placeholder="Type your answer here as you would in a real interview..."></textarea>

  <label style="color:#aaa; font-weight:normal; margin-bottom:4px;">Job Description (optional — for better context)</label>
  <textarea id="eval-jd" rows="4" placeholder="Paste the job description for more relevant feedback..."></textarea>

  <button onclick="evaluateAnswer()">Evaluate My Answer →</button>
  <div id="eval-output"></div>
</div>

<script>
  const BASE = "http://127.0.0.1:8000";
  let token = "";

  async function login() {
    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;

    const res = await fetch(`${BASE}/auth/login`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ email, password })
    });

    const data = await res.json();
    if (data.access_token) {
      token = data.access_token;
      document.getElementById("login-result").textContent = "✅ Logged in successfully! Token saved.";
    } else {
      document.getElementById("login-result").textContent = "❌ " + JSON.stringify(data);
    }
  }

  async function uploadResume() {
    if (!token) { document.getElementById("resume-result").textContent = "❌ Login first!"; return; }
    const file = document.getElementById("resume-file").files[0];
    if (!file) { document.getElementById("resume-result").textContent = "❌ Select a file first!"; return; }

    document.getElementById("resume-result").textContent = "⏳ Uploading and parsing...";

    const formData = new FormData();
    formData.append("file", file);

    const res = await fetch(`${BASE}/resume/upload`, {
      method: "POST",
      headers: { "Authorization": `Bearer ${token}` },
      body: formData
    });

    const data = await res.json();
    document.getElementById("resume-result").textContent = JSON.stringify(data, null, 2);
  }

  async function analyzeSkillGap() {
    if (!token) { document.getElementById("gap-result").textContent = "❌ Login first!"; return; }

    const job_title = document.getElementById("job-title").value;
    const job_description = document.getElementById("job-desc").value;

    if (!job_title || !job_description) {
      document.getElementById("gap-result").textContent = "❌ Fill in job title and description!";
      return;
    }

    document.getElementById("gap-result").textContent = "⏳ Analyzing with Claude...";

    const params = new URLSearchParams({ job_title, job_description });
    const res = await fetch(`${BASE}/jobs/skill-gap?${params}`, {
      headers: { "Authorization": `Bearer ${token}` }
    });

    const data = await res.json();
    document.getElementById("gap-result").textContent = JSON.stringify(data, null, 2);
  }

  async function generateQuestions() {
    const output = document.getElementById("questions-output");
    if (!token) { output.innerHTML = `<pre style="color:#f87171">❌ Login first!</pre>`; return; }

    const jd = document.getElementById("interview-jd").value;
    if (!jd) { output.innerHTML = `<pre style="color:#f87171">❌ Paste a job description first!</pre>`; return; }

    output.innerHTML = `<pre style="color:#facc15">⏳ RAG retrieving context → Claude generating questions...</pre>`;

    const res = await fetch(`${BASE}/interview/generate-questions`, {
      method: "POST",
      headers: { "Content-Type": "application/json", "Authorization": `Bearer ${token}` },
      body: JSON.stringify({ job_description: jd })
    });

    const data = await res.json();

    if (!res.ok) {
      output.innerHTML = `<pre style="color:#f87171">❌ ${JSON.stringify(data, null, 2)}</pre>`;
      return;
    }

    let html = `<div style="margin-top:12px; margin-bottom:8px; color:#888; font-size:13px;">
      Session ID: <strong style="color:#facc15">${data.session_id}</strong> &nbsp;|&nbsp;
      <span class="badge badge-success">✅ ${data.total} Questions Generated</span>
    </div>`;

    html += `<div class="question-list">`;
    data.questions.forEach((q, i) => {
      html += `
        <div class="question-item">
          <div class="q-num">${i + 1}</div>
          <div class="q-text">${q}</div>
        </div>`;
    });
    html += `</div>`;
    output.innerHTML = html;
  }

  async function evaluateAnswer() {
    const output = document.getElementById("eval-output");
    if (!token) { output.innerHTML = `<pre style="color:#f87171">❌ Login first!</pre>`; return; }

    const question = document.getElementById("eval-question").value;
    const answer = document.getElementById("eval-answer").value;
    const job_description = document.getElementById("eval-jd").value;

    if (!question || !answer) {
      output.innerHTML = `<pre style="color:#f87171">❌ Fill in both the question and your answer!</pre>`;
      return;
    }

    output.innerHTML = `<pre style="color:#facc15">⏳ Claude is evaluating your answer...</pre>`;

    const res = await fetch(`${BASE}/interview/evaluate-answer`, {
      method: "POST",
      headers: { "Content-Type": "application/json", "Authorization": `Bearer ${token}` },
      body: JSON.stringify({ question, answer, job_description })
    });

    const data = await res.json();

    if (!res.ok) {
      output.innerHTML = `<pre style="color:#f87171">❌ ${JSON.stringify(data, null, 2)}</pre>`;
      return;
    }

    // Color score based on value
    const score = data.score;
    const scoreColor = score >= 8 ? "#4ade80" : score >= 5 ? "#facc15" : "#f87171";

    output.innerHTML = `
      <div class="eval-result">

        <div class="score-box">
          <div class="score-number" style="color:${scoreColor}">${score}<span style="font-size:24px; color:#888">/10</span></div>
          <div class="score-label">Interview Answer Score</div>
        </div>

        <div class="eval-section strengths">
          <h3>✅ Strengths</h3>
          <p>${data.strengths || "—"}</p>
        </div>

        <div class="eval-section improvements">
          <h3>⚠️ Improvements</h3>
          <p>${data.improvements || "—"}</p>
        </div>

        <div class="eval-section ideal">
          <h3>💡 Ideal Answer</h3>
          <p>${data.ideal_answer || "—"}</p>
        </div>

      </div>`;
  }
</script>

</body>
</html>
